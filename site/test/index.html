<script>
function toggleNight() {
  const next = document.documentElement.dataset.night === '1' ? '0' : '1';
  document.documentElement.dataset.night = next;
  document.cookie = `kd_night=${next};max-age=${60*60*24*90};path=/`;
  document.getElementById('nightBtn').textContent = next === '1' ? '☀' : '☾';
}
if (document.documentElement.dataset.night === '1') document.getElementById('nightBtn').textContent = '☀';

// Always load the freshest /test on revisits (bypasses the 10-min page cache).
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// ── Crossword ────────────────────────────────────────────────────────────────
const P = window.CROSSWORD;
const KEY = 'kd_crossword_' + (P ? P.id : 'x');
let cur = { r: 0, c: 0 }, dir = 'A';
const cellInput = {};   // "r,c" -> <input>
const cellMeta = {};    // "r,c" -> { across:{entry}, down:{entry} }
let ORDER = [];         // [{e, down}] in Tab order
let _focusFired = false; // distinguishes a fresh tap from a re-tap (touch dir toggle)

// Flip across<->down (button + re-tap). highlight() runs ensureDir(), which
// reverts the flip if the cell only has one direction, so single-dir cells
// stay put and crossing cells toggle.
function cwFlipDir() {
  dir = dir === 'A' ? 'D' : 'A';
  const inp = cellInput[k(cur.r, cur.c)];
  if (inp) inp.focus();
  highlight();
}
function updateDirBtn() {
  const b = document.getElementById('cwDirBtn');
  if (b) b.textContent = dir === 'D' ? '↓ Down' : '→ Across';
}

function gotoWord(delta) {
  if (!ORDER.length) return;
  const e = curEntry(), down = dir === 'D';
  let i = ORDER.findIndex(x => x.e === e && x.down === down);
  i = i < 0 ? 0 : (i + delta + ORDER.length) % ORDER.length;
  dir = ORDER[i].down ? 'D' : 'A';
  focusCell(ORDER[i].e.row, ORDER[i].e.col);
}

function k(r, c) { return r + ',' + c; }
function isCell(r, c) { return P.solution[r] && P.solution[r][c] != null; }

function buildBoard() {
  const cw = document.getElementById('cw');
  const wrap = document.createElement('div');
  wrap.className = 'cw-board-wrap';
  const title = document.createElement('div');
  title.className = 'cw-title';
  title.textContent = P.title;
  wrap.appendChild(title);

  const grid = document.createElement('div');
  grid.className = 'cw-grid';
  grid.style.setProperty('--cols', P.cols);
  for (let r = 0; r < P.rows; r++) {
    for (let c = 0; c < P.cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cw-cell';
      if (!isCell(r, c)) { cell.classList.add('block'); grid.appendChild(cell); continue; }
      const num = P.numbers[r][c];
      if (num) { const s = document.createElement('span'); s.className = 'cw-num'; s.textContent = num; cell.appendChild(s); }
      const inp = document.createElement('input');
      inp.maxLength = 1; inp.autocomplete = 'off'; inp.setAttribute('aria-label', `cell ${r + 1},${c + 1}`);
      inp.dataset.r = r; inp.dataset.c = c;
      inp.addEventListener('focus', () => { _focusFired = true; cur = { r, c }; highlight(); });
      // A re-tap on the already-focused cell flips direction. Focus doesn't
      // refire on a re-tap, so no focus flag => this click is a re-tap. Works on
      // touch (click fires) where the old mousedown/double-tap did not.
      inp.addEventListener('click', () => { if (!_focusFired) toggleDir(); _focusFired = false; });
      inp.addEventListener('input', onInput);
      inp.addEventListener('keydown', onKeydown);
      cell.appendChild(inp);
      cellInput[k(r, c)] = inp;
      grid.appendChild(cell);
    }
  }
  wrap.appendChild(grid);
  cw.appendChild(wrap);

  // clue map: which across/down entry each cell belongs to
  const attach = (entry, down) => {
    for (let i = 0; i < entry.len; i++) {
      const r = entry.row + (down ? i : 0), c = entry.col + (down ? 0 : i);
      cellMeta[k(r, c)] = cellMeta[k(r, c)] || {};
      cellMeta[k(r, c)][down ? 'down' : 'across'] = entry;
    }
  };
  P.across.forEach(e => attach(e, false));
  P.down.forEach(e => attach(e, true));

  // Ordered word list for Tab / Shift+Tab (by clue number, across before down).
  ORDER = [
    ...P.across.map(e => ({ e, down: false })),
    ...P.down.map(e => ({ e, down: true })),
  ].sort((a, b) => a.e.num - b.e.num || (a.down ? 1 : 0) - (b.down ? 1 : 0));

  cw.appendChild(buildClues());
  document.getElementById('cwControls').style.display = 'flex';
}

function buildClues() {
  const wrap = document.createElement('div');
  wrap.className = 'cw-clues';
  const col = (label, list, down) => {
    const div = document.createElement('div');
    div.className = 'cw-clue-col';
    div.innerHTML = `<h3>${label}</h3>`;
    list.forEach(e => {
      const p = document.createElement('div');
      p.className = 'cw-clue';
      p.dataset.num = e.num; p.dataset.down = down ? '1' : '0';
      p.innerHTML = `<b>${e.num}</b>${e.clue} (${e.len})`;
      p.addEventListener('click', () => { dir = down ? 'D' : 'A'; focusCell(e.row, e.col); });
      div.appendChild(p);
    });
    return div;
  };
  wrap.appendChild(col('Across', P.across, false));
  wrap.appendChild(col('Down', P.down, true));
  return wrap;
}

function curEntry() {
  const m = cellMeta[k(cur.r, cur.c)];
  if (!m) return null;
  return dir === 'A' ? (m.across || m.down) : (m.down || m.across);
}
function toggleDir() {
  const m = cellMeta[k(cur.r, cur.c)];
  if (m && m.across && m.down) { dir = dir === 'A' ? 'D' : 'A'; highlight(); }
}
function focusCell(r, c) {
  if (!isCell(r, c)) return;
  cur = { r, c };
  const inp = cellInput[k(r, c)];
  if (inp) inp.focus();
  highlight();
}
// Keep `dir` pointing at a word that actually exists under the cursor. Without
// this, landing on a down-only cell while dir==='A' leaves every dir-based step
// (typing, highlight, reveal word) moving horizontally into nothing.
function ensureDir() {
  const m = cellMeta[k(cur.r, cur.c)];
  if (!m) return;
  if (dir === 'D' && !m.down && m.across) dir = 'A';
  else if (dir === 'A' && !m.across && m.down) dir = 'D';
}
function highlight() {
  ensureDir();
  document.querySelectorAll('.cw-cell').forEach(el => el.classList.remove('hl', 'cur'));
  document.querySelectorAll('.cw-clue').forEach(el => el.classList.remove('active'));
  const e = curEntry();
  if (e) {
    for (let i = 0; i < e.len; i++) {
      const r = e.row + (dir === 'D' ? i : 0), c = e.col + (dir === 'D' ? 0 : i);
      const inp = cellInput[k(r, c)];
      if (inp) inp.parentElement.classList.add('hl');
    }
    const clue = document.querySelector(`.cw-clue[data-num="${e.num}"][data-down="${dir === 'D' ? 1 : 0}"]`);
    if (clue) clue.classList.add('active');
  }
  const cinp = cellInput[k(cur.r, cur.c)];
  if (cinp) cinp.parentElement.classList.add('cur');
  updateDirBtn();
}

function step(r, c, back) {
  const d = back ? -1 : 1;
  let nr = r + (dir === 'D' ? d : 0), nc = c + (dir === 'A' ? d : 0);
  return { r: nr, c: nc };
}
function advance(back) {
  const n = step(cur.r, cur.c, back);
  if (isCell(n.r, n.c)) focusCell(n.r, n.c);
}
function onInput(ev) {
  const v = ev.target.value.toUpperCase().replace(/[^A-Z]/g, '');
  ev.target.value = v.slice(-1);
  clearMark(ev.target);
  save();
  if (ev.target.value) advance(false);
  checkWin();
}
function onKeydown(ev) {
  const r = +ev.target.dataset.r, c = +ev.target.dataset.c;
  const moves = { ArrowUp: ['D', -1], ArrowDown: ['D', 1], ArrowLeft: ['A', -1], ArrowRight: ['A', 1] };
  if (moves[ev.key]) {
    ev.preventDefault();
    const [wantDir, d] = moves[ev.key];
    if (dir !== wantDir) { dir = wantDir; highlight(); }
    let nr = r + (wantDir === 'D' ? d : 0), nc = c + (wantDir === 'A' ? d : 0);
    while (nr >= 0 && nr < P.rows && nc >= 0 && nc < P.cols) {
      if (isCell(nr, nc)) { focusCell(nr, nc); break; }
      nr += (wantDir === 'D' ? d : 0); nc += (wantDir === 'A' ? d : 0);
    }
  } else if (ev.key === 'Backspace') {
    if (!ev.target.value) { ev.preventDefault(); advance(true); const p = cellInput[k(cur.r, cur.c)]; if (p) { p.value = ''; clearMark(p); save(); } }
    else { clearMark(ev.target); }
  } else if (ev.key === 'Tab') {
    ev.preventDefault(); gotoWord(ev.shiftKey ? -1 : 1);
  } else if (ev.key === ' ') {
    ev.preventDefault(); toggleDir();
  }
}

function clearMark(inp) { inp.parentElement.classList.remove('wrong', 'right'); }

// ── controls ──
function cwCheck() {
  let wrong = 0, filled = 0;
  for (let r = 0; r < P.rows; r++) for (let c = 0; c < P.cols; c++) {
    if (!isCell(r, c)) continue;
    const inp = cellInput[k(r, c)];
    inp.parentElement.classList.remove('wrong', 'right');
    if (!inp.value) continue;
    filled++;
    if (inp.value === P.solution[r][c]) inp.parentElement.classList.add('right');
    else { inp.parentElement.classList.add('wrong'); wrong++; }
  }
  const s = document.getElementById('cwStatus');
  s.className = 'cw-status';
  s.textContent = filled === 0 ? 'Nothing filled in yet.' : wrong === 0 ? 'All filled cells are correct so far.' : `${wrong} incorrect cell${wrong > 1 ? 's' : ''}.`;
}
function cwRevealCell() {
  const inp = cellInput[k(cur.r, cur.c)];
  if (inp) { inp.value = P.solution[cur.r][cur.c]; clearMark(inp); save(); checkWin(); }
}
function cwRevealWord() {
  const e = curEntry(); if (!e) return;
  for (let i = 0; i < e.len; i++) {
    const r = e.row + (dir === 'D' ? i : 0), c = e.col + (dir === 'D' ? 0 : i);
    const inp = cellInput[k(r, c)]; if (inp) { inp.value = P.solution[r][c]; clearMark(inp); }
  }
  save(); checkWin();
}
function cwRevealAll() {
  for (let r = 0; r < P.rows; r++) for (let c = 0; c < P.cols; c++) {
    if (!isCell(r, c)) continue;
    const inp = cellInput[k(r, c)]; inp.value = P.solution[r][c]; clearMark(inp);
  }
  save(); checkWin();
}
function cwClear() {
  for (const key in cellInput) { cellInput[key].value = ''; clearMark(cellInput[key]); }
  localStorage.removeItem(KEY);
  document.getElementById('cwStatus').textContent = '';
}

// ── persistence ──
function save() {
  const rows = [];
  for (let r = 0; r < P.rows; r++) {
    let line = '';
    for (let c = 0; c < P.cols; c++) line += isCell(r, c) ? (cellInput[k(r, c)].value || '.') : '#';
    rows.push(line);
  }
  try { localStorage.setItem(KEY, rows.join('\n')); } catch (e) {}
}
function load() {
  let saved;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (!saved) return;
  const rows = saved.split('\n');
  for (let r = 0; r < P.rows; r++) for (let c = 0; c < P.cols; c++) {
    if (!isCell(r, c)) continue;
    const ch = rows[r] && rows[r][c];
    if (ch && ch !== '.' && ch !== '#') cellInput[k(r, c)].value = ch;
  }
}
function checkWin() {
  for (let r = 0; r < P.rows; r++) for (let c = 0; c < P.cols; c++) {
    if (!isCell(r, c)) continue;
    if (cellInput[k(r, c)].value !== P.solution[r][c]) return false;
  }
  const s = document.getElementById('cwStatus');
  s.className = 'cw-status win'; s.textContent = '✓ Solved — nice.';
  return true;
}

if (P && P.solution) {
  buildBoard();
  load();
  // focus first across clue's start
  if (P.across[0]) { dir = 'A'; focusCell(P.across[0].row, P.across[0].col); }
  checkWin();
} else {
  document.getElementById('cw').textContent = 'No puzzle data (crossword-data.js missing).';
}
</script>
